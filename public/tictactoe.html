<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: white;
            font-family: Arial, sans-serif;
        }
        #tic-tac-toe-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background-color: #333;
            padding: 5px;
            border-radius: 8px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="tic-tac-toe-board"></div>

    <script>
        // Initialize variables for socket communication, room ID, and player symbol
        let socket;
        let roomID;
        let playerSymbol;
        let isMyTurn = false;
    
        // Game board size and initial setup
        const boardSize = 3;
        const board = Array.from(Array(boardSize), () => Array(boardSize).fill(null));
        const ticTacToeBoard = document.getElementById('tic-tac-toe-board');
    
        // Create cells and attach click handlers
        for (let row = 0; row < boardSize; row++) {
            for (let col = 0; col < boardSize; col++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.id = `cell-${row}-${col}`;
                cell.addEventListener('click', () => makeMove(row, col));
                ticTacToeBoard.appendChild(cell);
            }
        }
    
        // Initialize the game
        function initGame(socketInstance, room, player) {
            socket = socketInstance;
            roomID = room;
            playerSymbol = player;
            isMyTurn = playerSymbol === 'X'; // X always starts
    
            // Handle incoming moves from the opponent
            socket.on('moveMade', ({ row, col, player }) => {
                const cell = document.getElementById(`cell-${row}-${col}`);
                if (cell && !cell.textContent) {
                    cell.textContent = player;
                    board[row][col] = player;
                    isMyTurn = player !== playerSymbol; // Switch turns
                }
            });
    
            // Handle game over scenarios (win or tie)
            socket.on('gameOver', (result) => {
                if (result === 'tie') {
                    alert("It's a tie!");
                } else {
                    alert(`${result} wins!`);
                }
                resetBoard();
            });
    
            // Notify if the opponent disconnects
            socket.on('opponentDisconnected', () => {
                alert("Your opponent disconnected. Game over.");
                resetBoard();
            });
        }
    
        // Attempt to make a move
        function makeMove(row, col) {
            // Only proceed if it's the player's turn and the cell is empty
            if (board[row][col] || !isMyTurn) return;
            
            // Update the local board and UI
            board[row][col] = playerSymbol;
            document.getElementById(`cell-${row}-${col}`).textContent = playerSymbol;
    
            // Emit the move to the server for syncing
            socket.emit('makeMove', { row, col, roomID, player: playerSymbol });
    
            // Switch turn to the opponent
            isMyTurn = false;
        }
    
        // Reset the board for a new game
        function resetBoard() {
            board.forEach((row, rIndex) => row.forEach((_, cIndex) => (board[rIndex][cIndex] = null)));
            Array.from(ticTacToeBoard.children).forEach(cell => (cell.textContent = ''));
            isMyTurn = playerSymbol === 'X'; // X always starts in a new game
        }
    </script>
    
    
</body>
</html>
