<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <style>
        /* Basic styling for Tic-Tac-Toe grid */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
        }
        .cell {
            width: 100px;
            height: 100px;
            font-size: 24px;
            text-align: center;
            line-height: 100px;
            border: 1px solid #333;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Tic-Tac-Toe</h2>
    <div id="board" class="board">
        <div id="cell-0-0" class="cell"></div>
        <div id="cell-0-1" class="cell"></div>
        <div id="cell-0-2" class="cell"></div>
        <div id="cell-1-0" class="cell"></div>
        <div id="cell-1-1" class="cell"></div>
        <div id="cell-1-2" class="cell"></div>
        <div id="cell-2-0" class="cell"></div>
        <div id="cell-2-1" class="cell"></div>
        <div id="cell-2-2" class="cell"></div>
    </div>

    <script>
        // Function to initialize the Tic-Tac-Toe game, called from client.js
        function initGame(socket, roomID, playerSymbol, isFirstTurn) {
            console.log("Game initialized", { roomID, playerSymbol, isFirstTurn });

            // Initialize board cells to be clickable
            const board = document.getElementById('board');
            board.addEventListener('click', (event) => {
                const cell = event.target;
                if (cell.classList.contains('cell') && cell.textContent === '') {
                    socket.emit('makeMove', {
                        row: cell.id.split('-')[1],
                        col: cell.id.split('-')[2],
                        roomID,
                        player: playerSymbol
                    });
                }
            });

            // Listen for moves from the server and update the board
            socket.on('moveMade', ({ row, col, player }) => {
                const cell = document.getElementById(`cell-${row}-${col}`);
                if (cell) cell.textContent = player;
            });

            // Additional handling for opponent disconnection
            socket.on('opponentDisconnected', () => {
                alert("Your opponent disconnected. Game over.");
                window.close(); // Close the game window if the opponent leaves
            });
        }
    </script>
</body>
</html>
