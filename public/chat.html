<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <link rel="stylesheet" href="chat.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/dist/bundle.js"></script>
</head>
<body>
  <div class="chatContainer">

  
  <ul id="welcomeMessage"></ul>

  <!-- Buttons for extra actions above the message area -->
  <div class="button-container">
    <button id="deleteAllMessages">Delete All Messages</button>
    <button id="playTictactoe">TTT</button>
  </div>

  <!-- Message display area -->
  <div id="messages" class="message-display"></div>

  <!-- Input container at the bottom -->
  <div class="message-input-container">
    <form id="chat-form">
      <input id="messageForm" type="text" placeholder="Type a message" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
</div>
</body>
</html>
