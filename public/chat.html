<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/dist/bundle.js"></script>
</head>
<body>
  <div class="container">
    <h1>Chat Application</h1>
    
    <!-- Room Selection -->
    <div class="room-select">
      <label for="room-select">Select a Room:</label>
      <select id="room-select">
        <option value="general">General</option>
        <option value="sports">Sports</option>
        <option value="tech">Tech</option>
        <option value="music">Music</option>
        <!-- Add more rooms as needed -->
      </select>
    </div>

    <!-- Buttons for extra actions above the message area -->
    <button id="deleteAllMessages">Delete All Messages</button>
    <button id="playTictactoe">TTT</button>

    <!-- Messages Display Area -->
    <div id="messages" class="messages"></div>

    <!-- Input Form at the Bottom -->
    <div class="message-input-container">
      <form id="message-form" style="display: flex; width: 100%;">
        <input id="message-input" type="text" placeholder="Type a message" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>

    <!-- Friend Requests Section -->
    <div id="friendRequests">
      <h3>Pending Friend Requests</h3>
      <ul id="friendRequestList">
        <!-- Friend requests will be dynamically added here -->
      </ul>
    </div>

    <div id="friendsList">
      <h3>Your Friends</h3>
      <!-- List friends here -->
    </div>
  </div>
</body>
</html>
