<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <link rel="stylesheet" href="chat.css">
    <script src="/socket.io/socket.io.js"></script>
  <script src="/dist/bundle.js"></script>
  <script src="/public/account.js"></script>
  <style> 
    .no-background { background: none; color: white; height:0.1% } 
    .dark-mode { filter: invert(1) hue-rotate(180deg); }
  </style>
</head>

<body>
  <div class="container">
      <!-- Taskbar Section -->
      <nav class="taskbar" aria-label="Main navigation">
          <button data-target="account.html" class="account-button" aria-label="Account">
              <img src="account.svg" class="button-icon" alt="Account" id="taskbar-profile-img">
          </button>
          <button data-target="add-friend.html" aria-label="Add Friend" id="addFriendButton">
            <img src="add-friend.svg" class="button-icon" alt="Add Friend">
          </button>          
          <button data-target="text.html" aria-label="Chat">
              <img src="chat.svg" class="button-icon" alt="Chat"> 
          </button>
          <button data-target="navigate.html" aria-label="Navigate">
              <img src="compass.svg" class="button-icon" alt="Navigate">
          </button>
          <button class="hamburger-icon" id="hamburger-menu" aria-label="More options">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
          </button>
      </nav>

      <!-- Bubble Menu Section -->
      <div class="bubble-menu" id="bubble-menu" aria-hidden="true">
          <ul>
              <li><a href="settings.html">Settings</a></li>
              <li><a href="#">Log Out</a></li>
              <li><a href="#">Profile</a></li>
              <li><a href="#">Notifications</a></li>
              <li><button id="darkModeButton" class="no-background">Darkmode</button></li>
          </ul>
      </div>

      <div class="room-select">
        <h3>Chats</h3>
      
        <!-- Chat Rooms -->
        <section class="chat-room-section" aria-labelledby="public-chats" id="room-buttons">
          <div class="chat-room" id = "general-button">
            <img src="general-icon.png" alt="General" class="room-icon">
            <div class="room-info">
              <span class="room-name">General</span>
              <span class="room-time">10:11 AM</span>
            </div>
          </div>
          <div class="chat-room" id = "random-button">
            <img src="random-icon.png" alt="Random" class="room-icon">
            <div class="room-info">
              <span class="room-name">Random</span>
              <span class="room-time">Yesterday</span>
            </div>
          </div>
          <div class="chat-room" id = "gaming-button">
            <img src="gaming-icon.png" alt="Gaming" class="room-icon">
            <div class="room-info">
              <span class="room-name">Gaming</span>
              <span class="room-time">24/4/1</span>
            </div>
          </div>
          <div class="chat-room" id = "music-button">
            <img src="music-icon.png" alt="Music" class="room-icon">
            <div class="room-info">
              <span class="room-name">Music</span>
              <span class="room-time">24/11/9</span>
            </div>
          </div>
        </section>
      
        <!-- Friend Requests Section -->
        <div id="friendRequests">
          <h3>Pending Friend Requests</h3>
          <ul id="friendRequestList">
            <!-- Friend requests will be dynamically added here -->
          </ul>
        </div>
      
        <div id="friendsList">
          <h3>Your Friends</h3>
          <!-- Friends will be dynamically added here -->
      </div>
      
      </div>
      

      <!-- Chat Content Section -->
      <main class="content" aria-labelledby="chat-heading">
        <div class="chatContainer">
          <h2 id="chat-heading">Welcome to the Chat Room</h2>
          <ul id="welcomeMessage"></ul>

          <!-- Action Buttons -->
          <div class="button-container">
            <button id="deleteAllMessages" aria-label="Delete All Messages">Delete All Messages</button>
            <button id="playTictactoe" aria-label="Play Tic Tac Toe">TTT</button>
            <button id="playWordGame" style="margin-top: 10px;" onclick="window.location.href='./Games/wordGameStart.html'">Word Game</button>
          </div>

          <!-- Message Display Area -->
          <div id="messages" class="message-display" aria-live="polite" aria-atomic="true"></div>

          <!-- Input Form -->
          <div class="message-input-container">
            <form id="chat-form" aria-label="Chat Form">
              <input id="messageForm" type="text" placeholder="" autocomplete="off" aria-label="Message Input" />
              <button type="submit" aria-label="Send Message">Send</button>
            </form>
          </div>
        </div>
      </main>
  </div>

  <script>
      // Load the saved profile image on page load
      window.onload = function() {
          const savedImage = sessionStorage.getItem('profileImage');
          if (savedImage) {
              document.getElementById('taskbar-profile-img').src = savedImage;
          }
      };

      // Toggle bubble menu visibility
      document.getElementById('hamburger-menu').addEventListener('click', function() {
          const bubbleMenu = document.getElementById('bubble-menu');
          bubbleMenu.classList.toggle('active');
          bubbleMenu.setAttribute('aria-hidden', !bubbleMenu.classList.contains('active'));
      });

      // Taskbar navigation
      document.querySelectorAll('.taskbar button[data-target]').forEach(button => {
          button.addEventListener('click', (e) => {
              const target = e.currentTarget.getAttribute('data-target');
              window.location.href = target;
          });
      });

      document.getElementById('darkModeButton').addEventListener('click', function() {
        document.body.classList.toggle('dark-mode'); // Save the user's preference 
        const isDarkMode = document.body.classList.contains('dark-mode'); 
        localStorage.setItem('darkMode', isDarkMode); }); // Load the user's preference on page load
      window.onload = function() { 
        const isDarkMode = JSON.parse(localStorage.getItem('darkMode')); 
        if (isDarkMode) { document.body.classList.add('dark-mode'); } 
      };
  </script>
</body>
</html>
