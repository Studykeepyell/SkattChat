<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/dist/bundle.js"></script>
<!-- test -->

</head>
<body>
  <div class="container">
    <div class="taskbar">
      <button id="btn1">1</button>
      <button id="btn2">2</button>
      <button id="btn3">3</button>
      <!-- Add more buttons as needed -->
    </div>
    <div class="friends-list">
      <h3>Friends List</h3>
      <ul>
        <li>Friend 1</li>
        <li>Friend 2</li>
        <li>Friend 3</li>
        <!-- Add more friends as needed -->
      </ul>
    </div>
    <div class="content">
      <button id="playTictactoe" class="styled-button">Play Tic-Tac-Toe</button>
      <ul id="welcomeMessage"></ul>

      <!-- Message display area -->
      <div id="messages">
        <button id="deleteAllMessages" class="delete-button">Delete All Messages</button>
      </div>

      <!-- Input container at the bottom -->
      <div class="message-input-container">
        <form id="chat-form" style="display: flex; width: 100%;">
          <input id="messageForm" type="text" placeholder="Type a message" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
