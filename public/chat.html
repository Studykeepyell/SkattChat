<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/public/dist/bundle.js"></script>

</head>
<body>
  <ul id="welcomeMessage"></ul>

  <!-- Buttons for extra actions above the message area -->
  <button id="deleteAllMessages" style="margin-top: 10px;">Delete All Messages</button>
  <button id="playTictactoe" style="margin-top: 10px;">TTT</button>

  <!-- Message display area -->
  <div id="messages"></div>

  <!-- Input container at the bottom -->
  <div class="message-input-container">
    <form id="chat-form" style="display: flex; width: 100%;">
      <input id="messageForm" type="text" placeholder="Type a message" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

</body>
</html>
