<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="taskbar">
      <button data-target="add-friend.html">
        <img src="add-friend.svg" class="button-icon" alt="Icon 1"> 
      </button>
      <button data-target="text.html">
        <img src="chat.svg" class="button-icon" alt="Icon 2"> 
      </button>
      <button data-target="navigate.html">
        <img src="icon3.svg" class="button-icon" alt="Icon 3">
      </button>
    </div>
    
    <div class="friends-list">
      <h3>Friends List</h3>
      <ul>
        <li>Friend 1</li>
        <li>Friend 2</li>
        <li>Friend 3</li>
      </ul>
    </div>
    <div class="content">
      <button id="playTictactoe" class="styled-button">Play Tic-Tac-Toe</button>
      <ul id="welcomeMessage"></ul>
      <div id="messages">
        <button id="deleteAllMessages" class="delete-button">Delete All Messages</button>
      </div>
      <div class="message-input-container">
        <form id="chat-form" style="display: flex; width: 100%;">
          <input id="messageForm" type="text" placeholder="Type a message" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
