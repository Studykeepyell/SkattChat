<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="styles.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/dist/bundle.js"></script>
</head>



<body>
  <div class="container">
      <div class="taskbar">
          <button data-target="account.html" class="account-button">
              <img src="account.svg" class="button-icon" alt="Icon 1" id="taskbar-profile-img">
          </button>
          <button data-target="add-friend.html">
              <img src="add-friend.svg" class="button-icon" alt="Icon 2"> 
          </button>
          <button data-target="text.html">
              <img src="chat.svg" class="button-icon" alt="Icon 3"> 
          </button>
          <button data-target="navigate.html">
              <img src="compass.svg" class="button-icon" alt="Icon 4">
          </button>
          <button class="hamburger-icon" id="hamburger-menu">
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
          </button>
      </div>

      <div class="bubble-menu" id="bubble-menu">
          <ul>
              <li><a href="settings.html">Settings</a></li>
              <li><a href="#">Log Out</a></li>
              <li><a href="#">Profile</a></li>
              <li><a href="#">Notifications</a></li>
              <li><a href="#">Help</a></li>
          </ul>
      </div>

      <div class="friends-list">
          <h3>Friends List</h3>
          <ul>
              <li>Friend 1</li>
              <li>Friend 2</li>
              <li>Friend 3</li>
              <li>Friend 4</li>
          </ul>
      </div>

      <div class="content">
        <div class="chatContainer">
          <ul id="welcomeMessage"></ul>
      
          <!-- Buttons for extra actions above the message area -->
          <div class="button-container">
            <button id="deleteAllMessages">Delete All Messages</button>
            <button id="playTictactoe">TTT</button>
            <button id="logoutButton">Logout</button> <!-- New Logout Button -->
          </div>
      
          <!-- Message display area -->
          <div id="messages" class="message-display"></div>
      
          <!-- Input container at the bottom -->
          <div class="message-input-container">
            <form id="chat-form">
              <input id="messageForm" type="text" placeholder="Type a message" autocomplete="off" />
              <button type="submit">Send</button>
            </form>
          </div>
        </div>
      </div>
  </div>
  <script>
      // Load the saved profile image on page load
      window.onload = function() {
          const savedImage = sessionStorage.getItem('profileImage');
          if (savedImage) {
              document.getElementById('taskbar-profile-img').src = savedImage;
          }
      };
  </script>
</body>
</html>
