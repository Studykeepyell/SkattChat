<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Game</title>
    <link rel="stylesheet" href="wordGame.css">
</head>
<body>
    <h1 class="title">Word Game</h1> <!-- Added title here -->
    <div class="wordGameContainer">
        <ul class="letters">
            <!-- Letters will be added here by JavaScript -->
        </ul>
        <div id="pointsDisplay">Points: 0</div>
        <div id="message"></div>
    </div>
    
    <div class="answerContainer">
        <input type="text" id="wordInput" name="lname" placeholder="Type a word">
        <button id="submit">Submit</button>
        <div id="timer">Time left: 60s</div>
    </div>
    
    <script type="module" src="wordGame.js"></script>
</body>
</html>
