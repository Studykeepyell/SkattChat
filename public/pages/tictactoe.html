<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <style>
        /* Basic styling for Tic-Tac-Toe grid */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
        }
        .cell {
            width: 100px;
            height: 100px;
            font-size: 24px;
            text-align: center;
            line-height: 100px;
            border: 1px solid #333;
            cursor: pointer;
            background-color: #f0f0f0;
        }
        .cell:hover {
            background-color: #e0e0e0;
        }
        .status {
            margin-top: 10px;
            font-size: 18px;
        }
        .reset-button {
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Tic-Tac-Toe</h2>
    <div id="board" class="board">
        <div id="cell-0-0" class="cell"></div>
        <div id="cell-0-1" class="cell"></div>
        <div id="cell-0-2" class="cell"></div>
        <div id="cell-1-0" class="cell"></div>
        <div id="cell-1-1" class="cell"></div>
        <div id="cell-1-2" class="cell"></div>
        <div id="cell-2-0" class="cell"></div>
        <div id="cell-2-1" class="cell"></div>
        <div id="cell-2-2" class="cell"></div>
    </div>
    <div id="status" class="status">Player X's turn</div>
    <button id="resetButton" class="reset-button">Reset Game</button>

    <script>
        function initGame(socket, roomID, playerSymbol, isFirstTurn) {
            let currentPlayer = 'X';
            let boardState = Array(3).fill(null).map(() => Array(3).fill(''));
            const statusDisplay = document.getElementById('status');

            const board = document.getElementById('board');
            board.addEventListener('click', (event) => {
                const cell = event.target;
                if (cell.classList.contains('cell') && cell.textContent === '') {
                    const row = cell.id.split('-')[1];
                    const col = cell.id.split('-')[2];
                    
                    socket.emit('makeMove', { row, col, roomID, player: currentPlayer });
                }
            });

            socket.on('moveMade', ({ row, col, player }) => {
                const cell = document.getElementById(`cell-${row}-${col}`);
                if (cell && !cell.textContent) {
                    cell.textContent = player;
                    boardState[row][col] = player;
                    if (checkWinner(player)) {
                        statusDisplay.textContent = `Player ${player} wins!`;
                    } else if (isBoardFull()) {
                        statusDisplay.textContent = "It's a tie!";
                    } else {
                        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                        statusDisplay.textContent = `Player ${currentPlayer}'s turn`;
                    }
                }
            });

            function checkWinner(player) {
                const winConditions = [
                    [[0, 0], [0, 1], [0, 2]],
                    [[1, 0], [1, 1], [1, 2]],
                    [[2, 0], [2, 1], [2, 2]],
                    [[0, 0], [1, 0], [2, 0]],
                    [[0, 1], [1, 1], [2, 1]],
                    [[0, 2], [1, 2], [2, 2]],
                    [[0, 0], [1, 1], [2, 2]],
                    [[0, 2], [1, 1], [2, 0]]
                ];
                return winConditions.some(condition => 
                    condition.every(([r, c]) => boardState[r][c] === player)
                );
            }

            function isBoardFull() {
                return boardState.flat().every(cell => cell);
            }

            document.getElementById('resetButton').addEventListener('click', resetGame);

            function resetGame() {
                boardState = Array(3).fill(null).map(() => Array(3).fill(''));
                currentPlayer = 'X';
                statusDisplay.textContent = "Player X's turn";
                Array.from(board.children).forEach(cell => cell.textContent = '');
            }

            socket.on('opponentDisconnected', () => {
                alert("Your opponent disconnected. Game over.");
                window.close();
            });
        }
    </script>
    <script src="../scripts/ticTacToe.js" defer></script>

</body>
</html>
