version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skattchat-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - skattchat-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: skattchat-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - skattchat-network

networks:
  skattchat-network:
    driver: bridge 