services:
  backend:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile.dev
    container_name: skattchat-backend-dev
    ports:
      - "3001:3001"
    env_file:
      - ../../.env
    command: >
      sh -c "cd backend && 
             npm install &&
             npm run dev"
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/backend/node_modules
    networks:
      - skattchat-network-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile.dev
    container_name: skattchat-frontend-dev
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
    command: npm run dev:web
    volumes:
      - ../../:/app
      - /app/node_modules
    networks:
      - skattchat-network-dev
    depends_on:
      - backend

  nginx:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile.nginx
    container_name: skattchat-nginx-dev
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ../../public:/usr/share/nginx/html
    networks:
      - skattchat-network-dev

networks:
  skattchat-network-dev:
    driver: bridge
    name: skattchat-network-dev 