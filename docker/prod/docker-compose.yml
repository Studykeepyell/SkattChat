services:
  backend:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: skattchat-backend
    ports:
      - "3001:3001"
    env_file:
      - ../../.env
    volumes:
      - uploads:/app/backend/uploads
    networks:
      - skattchat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  nginx:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile.nginx
    container_name: skattchat-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../certbot/conf:/etc/letsencrypt
      - ../certbot/www:/var/www/certbot
      - ../../public:/usr/share/nginx/html
    networks:
      - skattchat-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: skattchat-certbot
    volumes:
      - ../certbot/conf:/etc/letsencrypt
      - ../certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --force-renewal --email ${CERTBOT_EMAIL} -d ${DOMAIN} --agree-tos
    depends_on:
      - nginx

networks:
  skattchat-network:
    driver: bridge

volumes:
  uploads: 