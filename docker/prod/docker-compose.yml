version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: skattchat-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - MONGO_URI=mongodb+srv://Sky:Sky090726@cluster1.ripon.mongodb.net/?retryWrites=true&w=majority&appName=Cluster1
      - JWT_SECRET=4a3f0b1cdd785d0871e3b7e5a3db4f8a0c6d8e8f0e7c9b1c2d3e4f5a6b7c8d9e
      - JWT_REFRESH_SECRET=1a1ee034eb0ca536992c894897eaef94f7c73a5538b0d16ae53d2a650ff57f7a
      - ONLINE_API_URL=https://skattchat.online
      - OPENAI_API_KEY=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
      - GIPHY_API_KEY=xvALP5ayBaiAvATq6Sx8VpxhS30zCeD2
      - CORS_ORIGIN=https://skattchat.online
    restart: unless-stopped
    networks:
      - skattchat-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - uploads:/app/backend/uploads

  nginx:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile.nginx
    container_name: skattchat-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../certbot/conf:/etc/letsencrypt
      - ../certbot/www:/var/www/certbot
    networks:
      - skattchat-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: skattchat-certbot
    volumes:
      - ../certbot/conf:/etc/letsencrypt
      - ../certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --force-renewal --email skyjin@skattchat.online -d skattchat.online --agree-tos
    depends_on:
      - nginx

networks:
  skattchat-network:
    driver: bridge

volumes:
  uploads: 