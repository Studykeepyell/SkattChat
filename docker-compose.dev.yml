version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: skattchat-backend-dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true  # Enable polling for Windows
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
      - ./public:/app/public
      - ./webpack:/app/webpack
      - ./.env:/app/.env
      - /app/node_modules  # Anonymous volume for node_modules
    networks:
      - skattchat-network-dev
    command: npm run dev

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: skattchat-nginx-dev
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./public:/usr/share/nginx/html
    networks:
      - skattchat-network-dev

networks:
  skattchat-network-dev:
    driver: bridge 