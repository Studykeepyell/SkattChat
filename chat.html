<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat room</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <ul id="welcomeMessage"></ul>
  
  <form id="chat-form">

    <input id="messageForm" autocomplete="off" placeholder="Type a message" />
    <button type="submit">Send</button>
  </form>

  <button id="deleteAllMessages" style="margin-top: 10px;">Delete All Messages</button>
  <div class="container" id="messages">
      <div class ="uppertext">
          hello
      </div>
      <ul id="messages"></ul>
      <div class = "message-container">
        <div class = "character-picture"></div>
        <div class="buble-wrapper">
          <div class="speech-bubble">
            <div class="message"></div>
          </div>
        </div>
        <div class="lower-tex">Monday: 20:38</div>
  </div>
  <script src="client.js"></script>
</body>
</html>
