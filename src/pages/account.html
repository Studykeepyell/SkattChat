<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Editor</title>
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline' https://cdn.socket.io;
                   style-src 'self' 'unsafe-inline';
                   connect-src 'self' https://skattchat.online http://localhost:3000 
                              ws://localhost:3000/socket.io/ wss://localhost:3000/socket.io/ 
                              https://skattchat.online/socket.io/ wss://skattchat.online/socket.io/;
                   img-src 'self' data: https: blob:">
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/account.css">
    
    <!-- Load scripts in correct order -->
    <script defer src="/socket.io/socket.io.js"></script>
    <script defer src="/dist/runtime.bundle.js"></script>
    <script defer src="/dist/vendors.bundle.js"></script>
    <script defer src="/dist/account.bundle.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Profile Editor</h1>
        </header>
        
        <main>
            <section class="profile-info">
                <div class="button-container">
                    <button class="back-to-home">Back to Home</button>
                </div>

                <div class="profile-picture">
                    <form id="upload-form" enctype="multipart/form-data">
                        <img src="../assets/images/account.svg" alt="Profile Picture" id="profile-img" onclick="document.getElementById('upload-img').click();">
                        <input type="file" id="upload-img" accept="image/*" style="display: none;">
                    </form>
                </div>

                <div class="profile-details">
                    <div class="input-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" readonly>
                    </div>
                    <button id="save-profile">Save</button>
                </div>
            </section>
            
            <section class="friend-list">
                <h2>Friends</h2>
                <ul id="friends">
                    <!-- Friends will be dynamically added here -->
                </ul>
            </section>
        </main>
        
        <footer>
            <button id="logout">Log Out</button>
        </footer>
    </div>
</body>
</html>
