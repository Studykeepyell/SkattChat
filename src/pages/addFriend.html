<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Friends - Skattchat</title>
    <link rel="stylesheet" href="/dist/styles/index.css">
    <link rel="stylesheet" href="/dist/styles/chat.css">
</head>
<body>
    <div class="container">
        <!-- Taskbar Section -->
        <nav class="taskbar" aria-label="Main navigation">
            <button
                data-target="/dist/pages/account.html"
                class="account-button"
                aria-label="Account"
            >
                <img
                    src="/dist/assets/images/default-avatar.svg"
                    alt="Account"
                    id="taskbar-profile-img"
                    style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;"
                />
            </button>
            <button
                data-target="/dist/pages/addFriend.html"
                aria-label="Add Friend"
                class="active"
                id="addFriendButton"
            >
                <img src="/dist/assets/images/add-friend.svg" class="button-icon" alt="Add Friend" />
            </button>
            <button data-target="/dist/pages/chat.html" aria-label="Chat">
                <img src="/dist/assets/images/chat.svg" class="button-icon" alt="Chat" />
            </button>
            <button data-target="/dist/pages/explore.html" aria-label="Navigate">
                <img src="/dist/assets/images/compass.svg" class="button-icon" alt="Navigate" />
            </button>
            <button class="hamburger-icon" id="hamburger-menu" aria-label="More options">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </nav>

        <!-- Bubble Menu Section -->
        <div class="bubble-menu" id="bubble-menu" aria-hidden="true">
            <ul>
                <li><a href="/dist/pages/settings.html">Settings</a></li>
                <li><a href="/dist/pages/login.html">Log Out</a></li>
                <li><a href="/dist/pages/account.html">Profile</a></li>
                <li><a href="#">Notifications</a></li>
                <li><button id="darkModeButton" class="no-background">Theme</button></li>
            </ul>
        </div>

        <!-- Main Content Section -->
        <div class="content">
            <!-- Search Section -->
            <section class="search-section">
                <h2>Find Friends</h2>
                <form id="searchForm">
                    <input type="text" id="searchInput" placeholder="Search for users...">
                    <button type="submit">Search</button>
                </form>
                <div id="resultsContainer"></div>
            </section>

            <!-- Friend Requests Section -->
            <section class="requests-section">
                <h2>Friend Requests</h2>
                <div id="requestsContainer"></div>
            </section>
        </div>
    </div>

    <!-- Load scripts in correct order -->
    <script defer src="/dist/runtime.bundle.js"></script>
    <script defer src="/dist/vendors.bundle.js"></script>
    <script defer src="/dist/friends.bundle.js"></script>
</body>
</html>
