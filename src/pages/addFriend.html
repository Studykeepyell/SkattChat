<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Friends</title>
    <link rel="stylesheet" href="../styles/addFriend.css">
</head>
<body>
    <!-- Taskbar Section -->
    <nav class="taskbar">
        <a href="account.html" class="taskbar-button">
            <img src="../assets/images/account.svg" class="button-icon" alt="Account"> 
        </a>        
        <a href="addFriend.html" class="taskbar-button">
            <img src="../assets/images/add-friend.svg" class="button-icon" alt="Add Friend"> 
        </a>
        <a href="chat.html" class="taskbar-button">
            <img src="../assets/images/chat.svg" class="button-icon" alt="Chat"> 
        </a>        
        <a href="navigate.html" class="taskbar-button">
            <img src="../assets/images/compass.svg" class="button-icon" alt="Navigate">
        </a>
    </nav>
    
    <!-- Main Content Section -->
    <div class="main-content">
        <!-- Left Section: Search -->
        <section class="search-section">
            <h2>Find Friends</h2>
            <form id="searchForm" class="search-form" onsubmit="return false">
                <div class="search-box-container">
                    <input type="text" 
                           id="searchInput" 
                           class="search-input"
                           placeholder="Search by username..."
                           required>
                    <button type="submit" class="search-button">
                        Search
                    </button>
                </div>
            </form>

            <section id="resultsContainer" class="results-container">
                <!-- Search results will be dynamically added here -->
            </section>
        </section>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Right Section: Friend Requests -->
        <section class="requests-section">
            <h2>Friend Requests</h2>
            <div id="requestsContainer" class="requests-container">
                <!-- Friend requests will be dynamically added here -->
            </div>
        </section>
    </div>
</body>
</html>
