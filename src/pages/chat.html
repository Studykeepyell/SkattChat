<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link rel="stylesheet" href="/dist/styles/index.css">
    <link rel="stylesheet" href="/dist/styles/chat.css">

    <style> 
      .no-background { background: none; color: white; height:0.1% } 
      .dark-mode { filter: invert(1) hue-rotate(180deg); }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Taskbar Section -->
      <nav class="taskbar" aria-label="Main navigation">
        <button
          data-target="/dist/pages/account.html"
          class="account-button"
          aria-label="Account"
        >
          <img
            src="/dist/assets/images/default-avatar.svg"
            alt="Account"
            id="taskbar-profile-img"
            style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;"
          />
        </button>
        <button
          data-target="/dist/pages/addFriend.html"
          aria-label="Add Friend"
          id="addFriendButton"
        >
          <img src="/dist/assets/images/add-friend.svg" class="button-icon" alt="Add Friend" />
        </button>
        <button data-target="/dist/pages/chat.html" aria-label="Chat" class="active">
          <img src="/dist/assets/images/chat.svg" class="button-icon" alt="Chat" />
        </button>
        <button data-target="/dist/pages/explore.html" aria-label="Navigate">
          <img src="/dist/assets/images/compass.svg" class="button-icon" alt="Navigate" />
        </button>
        <button
          class="hamburger-icon"
          id="hamburger-menu"
          aria-label="More options"
        >
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </nav>

      <!-- Bubble Menu Section -->
      <div class="bubble-menu" id="bubble-menu" aria-hidden="true">
        <ul>
          <li><a href="/dist/pages/settings.html">Settings</a></li>
          <li><a href="/dist/pages/login.html">Log Out</a></li>
          <li><a href="/dist/pages/account.html">Profile</a></li>
          <li><a href="#">Notifications</a></li>
          <li><button id="darkModeButton" class="no-background">Theme</button></li>
        </ul>
      </div>

      <div class="room-select">
        <div class="room-header">
          <button class="create-room-btn" id="createRoomBtn">+</button>
          <div class="room-search-container">
            <input type="text" class="room-search" id="roomNameInput" placeholder="Search">
          </div>
        </div>
        <!-- Chat Rooms -->
        <section
          class="chat-room-section"
          aria-labelledby="public-chats"
          id="roomList"
        >
        </section>
      </div>

      <!-- Chat Content Section -->
      <main class="content" aria-labelledby="chat-heading">
        <div class="chatContainer">
          <div id="chat-heading" class="chat-banner">
            <h2>Welcome to Skattchat</h2>
            <span class="participant-count">0 participants</span>
          </div>

          <!-- Message Display Area -->
          <div
            id="messages"
            class="message-display"
            aria-live="polite"
            aria-atomic="true"
          ></div>

          <!-- Message Input Container -->
          <div id="message-input-root" class="message-input-container"></div>
        </div>
      </main>
    </div>

    <!-- Load scripts in correct order -->
    <script defer src="/dist/runtime.bundle.js"></script>
    <script defer src="/dist/vendors.bundle.js"></script>
    <script defer src="/dist/chat.bundle.js"></script>
  </body>
</html>
