<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/chat.css">

    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline' https://cdn.socket.io;
                   style-src 'self' 'unsafe-inline';
                   connect-src 'self' https://skattchat.online http://localhost:3000 
                              ws://localhost:3000/socket.io/ wss://localhost:3000/socket.io/ 
                              https://skattchat.online/socket.io/ wss://skattchat.online/socket.io/;
                   img-src 'self' data: https: blob:">

    <style> 
      .no-background { background: none; color: white; height:0.1% } 
      .dark-mode { filter: invert(1) hue-rotate(180deg); }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Taskbar Section -->
      <nav class="taskbar" aria-label="Main navigation">
        <button
          data-target="account.html"
          class="account-button"
          aria-label="Account"
        >
          <img
            src="/assets/images/default-avatar.svg"
            alt="Account"
            id="taskbar-profile-img"
            style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;"
          />
        </button>
        <button
          data-target="addFriend.html"
          aria-label="Add Friend"
          id="addFriendButton"
        >
          <img src="../assets/images/add-friend.svg" class="button-icon" alt="Add Friend" />
        </button>
        <button data-target="" aria-label="Chat">
          <img src="../assets/images/chat.svg" class="button-icon" alt="Chat" />
        </button>
        <button data-target="explore.html" aria-label="Navigate">
          <img src="../assets/images/compass.svg" class="button-icon" alt="Navigate" />
        </button>
        <button
          class="hamburger-icon"
          id="hamburger-menu"
          aria-label="More options"
        >
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </nav>

      <!-- Bubble Menu Section -->
      <div class="bubble-menu" id="bubble-menu" aria-hidden="true">
        <ul>
          <li><a href="../pages/settings.html">Settings</a></li>
          <li><a href="../pages/login.html">Log Out</a></li>
          <li><a href="../pages/account.html">Profile</a></li>
          <li><a href="#">Notifications</a></li>
          <li><button id="darkModeButton" class="no-background">Darkmode</button></li>        </ul>
      </div>

      <div class="room-select">
        <div class="room-header">
          <button class="create-room-btn" id="createRoomBtn">+</button>
          <div class="room-search-container">
            <input type="text" class="room-search" id="roomNameInput" placeholder="Search rooms...">
          </div>
        </div>
        <!-- Chat Rooms -->
        <section
          class="chat-room-section"
          aria-labelledby="public-chats"
          id="roomList"
        >

        
        </section>
      </div>

      <!-- Chat Content Section -->
      <main class="content" aria-labelledby="chat-heading">
        <div class="chatContainer">
          <div id="chat-heading" class="chat-banner">
            <h2>Welcome to Skattchat</h2>
            <span class="participant-count">0 participants</span>
          </div>

          <!-- Message Display Area -->
          <div
            id="messages"
            class="message-display"
            aria-live="polite"
            aria-atomic="true"
          ></div>

          <!-- Message Input Container -->
          <div id="message-input-root" class="message-input-container"></div>
        </div>
      </main>
    </div>

    <!-- Load scripts in correct order -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      class MessageInput {
        constructor(container) {
          this.container = container;
          this.message = '';
          this.isGifPickerOpen = false;
          this.render();
          this.attachEventListeners();
        }

        render() {
          this.container.innerHTML = `
            <div class="message-input-wrapper">
              <form class="message-form">
                <!-- Input row with buttons -->
                <div class="input-row">
                  <div class="button-group">
                    <button type="button" class="emoji-button button-ghost" title="Emoji">
                      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                      </svg>
                    </button>

                    <button type="button" class="file-button button-ghost" title="File">
                      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                      </svg>
                    </button>

                    <button type="button" class="scissors-button button-ghost" title="Scissors">
                      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="6" cy="6" r="3"></circle>
                        <circle cx="6" cy="18" r="3"></circle>
                        <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
                        <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
                        <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
                      </svg>
                    </button>

                    <button type="button" class="chat-button button-ghost" title="Chat">
                      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                      </svg>
                    </button>
                  </div>

                  <input
                    type="text"
                    class="message-input"
                    
                  />

                  <div class="button-group">
                    <button type="button" class="video-call-button button-ghost" title="Video Call">
                      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 7l-7 5 7 5V7z"></path>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                      </svg>
                    </button>

                    <button type="submit" class="send-button" disabled>
                      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                      </svg>
                    </button>
                  </div>
                </div>
              </form>
            </div>
          `;
        }

        attachEventListeners() {
          const form = this.container.querySelector('form');
          const input = this.container.querySelector('.message-input');
          const sendButton = this.container.querySelector('.send-button');

          input.addEventListener('input', (e) => {
            this.message = e.target.value;
            sendButton.disabled = !this.message.trim();
          });

          form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!this.message.trim()) return;
            
            // Emit the message event
            const event = new CustomEvent('message-sent', {
              detail: { message: this.message }
            });
            this.container.dispatchEvent(event);
            
            // Clear input
            this.message = '';
            input.value = '';
            sendButton.disabled = true;
          });
        }
      }

      // Initialize when DOM is ready
      document.addEventListener('DOMContentLoaded', () => {
        const messageInputRoot = document.getElementById('message-input-root');
        if (messageInputRoot) {
          new MessageInput(messageInputRoot);
        }
      });
    </script>
  </body>
</html>
