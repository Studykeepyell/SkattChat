<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call - Skattchat</title>
    <link rel="stylesheet" href="/dist/styles/index.css">
    <style>
        .video-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem;
            height: calc(100vh - 80px);
        }
        
        .video-wrapper {
            position: relative;
            flex: 1;
            min-width: 300px;
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.8);
        }
        
        .control-button {
            padding: 0.75rem;
            border-radius: 50%;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .control-button:hover {
            background: #444;
        }
        
        .control-button.danger {
            background: #dc3545;
        }
        
        .control-button.danger:hover {
            background: #bd2130;
        }
        
        .participant-name {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            color: white;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
        }
    </style>
    
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline' https://cdn.socket.io;
                   style-src 'self' 'unsafe-inline';
                   connect-src 'self' https://skattchat.online http://localhost:3000 
                              ws://localhost:3000/socket.io/ wss://localhost:3000/socket.io/ 
                              https://skattchat.online/socket.io/ wss://skattchat.online/socket.io/;
                   media-src 'self' blob:">
</head>
<body>
    <div class="video-container">
        <div class="video-wrapper">
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="participant-name">You</div>
        </div>
        <div class="video-wrapper">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="participant-name">Remote User</div>
        </div>
    </div>
    
    <div class="controls">
        <button class="control-button" id="toggleMic" title="Toggle Microphone">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
        </button>
        <button class="control-button" id="toggleVideo" title="Toggle Video">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 7l-7 5 7 5V7z"></path>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
        </button>
        <button class="control-button danger" id="endCall" title="End Call">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path>
                <line x1="23" y1="1" x2="1" y2="23"></line>
            </svg>
        </button>
    </div>

    <script defer src="/dist/runtime.bundle.js"></script>
    <script defer src="/dist/vendors.bundle.js"></script>
    <script defer src="/dist/video-call.bundle.js"></script>
</body>
</html>
