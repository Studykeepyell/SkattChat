<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../styles/register.css">
</head>
<body>
    <div class="register-container">
        <h2>Register</h2>
        <form id="register-form" data-auth-type="register">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="Username" required>
                <button type="button" id="generate-username" class="generate-btn">Random</button>
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
                <div class="password-requirements">
                    <p>Password must contain:</p>
                    <ul>
                        <li id="length">8+ characters</li>
                        <li id="uppercase">Uppercase letter</li>
                        <li id="lowercase">Lowercase letter</li>
                        <li id="number">Number</li>
                        <li id="special">Special character</li>
                    </ul>
                </div>
            </div>
            <button type="submit">Register</button>
        </form>
        <p>Have an account? <a href="login.html">Login here</a></p>
        <div id="error-message" style="display: none; color: red;"></div>
    </div>
    <script src="/dist/runtime.bundle.js"></script>
    <script src="/dist/vendors.bundle.js"></script>
    <script src="/dist/register.bundle.js"></script>
</body>
</html>
