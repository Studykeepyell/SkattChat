appId: "com.skyjin.skattchat"
productName: "SkattChat"
copyright: "Copyright © 2024 SkyJin"

directories:
  output: "dist/releases"
  buildResources: "build/resources"
  app: "dist/app"

files:
  - "**/*"
  - "!**/*.map"
  - "!**/*.ts"

asar: true
compression: maximum

win:
  target:
    - target: "nsis"
      arch: ["x64"]
  icon: "icon.ico"  # Simplified path
  artifactName: "${productName}-Setup-${version}.${ext}"
  signingHashAlgorithms: ["sha256"]  # Add explicit hash algorithm
  timeStampServer: "http://timestamp.digicert.com"  # Add timestamp server
  sign: false  # Disable signing for development

mac:
  target:
    - target: "dmg"
      arch: ["x64", "arm64"]
  icon: "icon.icns"  # Simplified path
  category: "public.app-category.social-networking"
  artifactName: "${productName}-${version}-${arch}.${ext}"

linux:
  target:
    - target: "AppImage"
      arch: ["x64"]
  icon: "icon.png"  # Simplified path
  category: "Network;Chat"
  artifactName: "${productName}-${version}.${ext}"

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "${productName}"
  installerIcon: "icon.ico"  # Simplified path
  uninstallerIcon: "icon.ico"  # Simplified path
  artifactName: "${productName}-${arch}-Setup.${ext}"
  differentialPackage: false  # Disable differential updates

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: "link"
      path: "/Applications"

publish:
  provider: "github"
  private: false
  releaseType: "release"